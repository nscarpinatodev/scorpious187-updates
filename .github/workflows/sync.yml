name: Sync update manifests from GitHub releases

# Pulls latestVersion / notes / notesUrl for every module from what that
# module's repo publishes — its CHANGELOG.md section for the release, or the
# release body — and commits the result. Editorial fields (critical,
# forceResetId, announcement) are left alone.

on:
  schedule:
    # Hourly, so a release shows up in the notifier within the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Limit to a single module id (optional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-manifests
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync from releases
        env:
          # Reads public releases across the account; no extra scope needed.
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            node scripts/sync.mjs --only "${{ inputs.only }}"
          else
            node scripts/sync.mjs
          fi

      - name: Validate the result
        run: node scripts/validate.mjs

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- '*-update.json')" ]; then
            echo "No manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-update.json'
          git commit -m "Sync update manifests from GitHub releases"
          git push
